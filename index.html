<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101017"><title>Тебе. От меня.</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#101017;color:#f4efff;font-family:"DM Sans",sans-serif;min-height:100dvh}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 80% 10%,#65518c38,transparent 52%),radial-gradient(ellipse at 0% 100%,#3b426c45,transparent 50%);pointer-events:none;animation:glow 9s alternate infinite}main{position:relative;width:min(1140px,100%);margin:auto;padding:24px clamp(18px,5vw,60px)}header,footer{display:flex;justify-content:space-between;align-items:center;color:#aaa0ba;font-size:10px;letter-spacing:.17em}header{padding-bottom:22px;border-bottom:1px solid #ffffff18}header b{color:#d4baff}.hero{display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:35px;padding:55px 0 40px}.kicker{font-size:11px;color:#c5aff1;letter-spacing:.18em}h1,h2{font-family:"Space Grotesk",sans-serif;letter-spacing:-.065em}h1{font-size:clamp(54px,9vw,105px);line-height:.98;margin:18px 0}h1 em{font-style:normal;color:#c5aff1}p{line-height:1.75;color:#c8c0d1}.portrait{position:relative;aspect-ratio:1;max-width:255px;width:100%;justify-self:center;padding:14px;border:1px solid #c5aff133;border-radius:28px;transform:rotate(4deg);animation:float 6s ease-in-out infinite}.portrait img{width:100%;height:100%;object-fit:cover;border-radius:18px}.portrait:before{content:"";position:absolute;inset:-12px;border:1px dashed #c5aff155;border-radius:35px}.portrait:after{content:"A MEMORY / 01";position:absolute;bottom:23px;left:23px;background:#101017d9;padding:8px;font-size:9px;letter-spacing:.1em}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{font:inherit;text-align:left;position:relative;min-height:135px;border:1px solid #ffffff19;border-radius:15px;background:#ffffff06;color:inherit;padding:19px;cursor:pointer;overflow:hidden;transition:transform .3s,background .3s,border-color .3s}.tile:hover,.tile:focus-visible{transform:translateY(-4px);background:#c5aff116;border-color:#c5aff166}.tile small{color:#c5aff1;letter-spacing:.12em;font-size:10px}.tile strong{display:block;font-size:20px;margin:15px 22px 0 0;letter-spacing:-.04em}.tile span{position:absolute;right:17px;bottom:16px;color:#c5aff1;font-size:24px}.tile.feature{grid-column:span 2;background:linear-gradient(125deg,#c5aff11b,#ffffff04)}footer{padding:24px 0}dialog{width:min(570px,calc(100% - 28px));max-height:85dvh;overflow:auto;border:1px solid #c5aff144;border-radius:24px;background:#1b1824;color:#f4efff;padding:32px;margin:auto;box-shadow:0 30px 100px #0009}dialog[open]{animation:enter .35s both}dialog::backdrop{background:#08070cbf;backdrop-filter:blur(14px)}dialog h2{font-size:36px;margin:24px 0 14px}dialog p{white-space:pre-line}dialog button{float:right;background:none;color:#e9dcff;border:1px solid #ffffff30;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer}@keyframes enter{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes glow{to{opacity:.5}}@media(max-width:650px){.hero{grid-template-columns:1fr;gap:20px;padding:30px 0}.portrait{grid-row:1;justify-self:start;width:110px;margin:0 10px}.hero h1{font-size:58px;margin:12px 0}.hero p{font-size:14px;margin-bottom:0}.board{grid-template-columns:1fr 1fr}.tile{min-height:110px;padding:14px}.tile strong{font-size:17px}.tile.feature{grid-column:span 2}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main><header><b>✳ &nbsp; PERSONAL LETTER</b><span>НЕОТПРАВЛЕННЫЕ СЛОВА</span></header><section class="hero"><div><div class="kicker">01 / ТО, ЧТО ОСТАЛОСЬ ВО МНЕ</div><h1>Тебе.<br><em>От меня.</em></h1><p>Иногда обычных слов действительно недостаточно. Поэтому здесь я собрал то, что мне хотелось сказать тебе без спешки, без недосказанности и без ожидания ответа.</p></div><div class="portrait"><img src="./image/image.png" alt="Памятное изображение"></div></section><section class="board" aria-label="Фрагменты письма"></section><footer><span>СОЗДАНО С ЧУВСТВОМ</span><span>TL / PERSONAL SPACE</span></footer></main><dialog><button aria-label="Закрыть">×</button><div class="kicker"></div><h2></h2><p></p></dialog><script>
const letters=[
["Самое важное","Ты действительно многое для меня значила. Не просто потому, что мы общались, а потому, что рядом с тобой даже самые обыкновенные моменты становились особенными. Мне трудно подобрать слова, которые передали бы всю глубину этого чувства. Но я не хочу притворяться, будто ничего не было."],
["Я скучаю","Я скучаю по нашим разговорам, по мелочам, которые когда-то казались совершенно обычными. Иногда хочется снова рассказать тебе какую-нибудь глупость или поделиться событием дня. И именно в такие моменты я особенно ясно понимаю, насколько дорого мне было наше общение."],
["Воспоминания","Некоторые моменты невозможно повторить. Но их ценность от этого не исчезает. Я благодарен за то тепло, которое было между нами, за искренние разговоры и за возможность узнать тебя."],
["О том, что болит","Мне бывает трудно принять, что всё изменилось. Я могу одновременно дорожить прошлым и понимать, что у каждого из нас есть собственный путь. Мне не обязательно скрывать свою грусть, но и превращать её в твою обязанность я не хочу."],
["Если бы я мог сказать","Мне хотелось бы, чтобы ты знала: мои чувства были настоящими. Я не всегда умел выражать их правильно, иногда мог ошибаться. Но всё хорошее, что я чувствовал к тебе, было искренним."],
["Спасибо","Спасибо за моменты, которые остались со мной. Я не знаю, что будет дальше, и не хочу решать это за нас обоих. Просто желаю тебе счастья и спокойствия. А себе — сил идти дальше, сохраняя хорошее в памяти."]
];const board=document.querySelector('.board'),d=document.querySelector('dialog');letters.forEach(([title,body],i)=>{const b=document.createElement('button');b.className='tile'+(i===0?' feature':'');b.innerHTML='<small>FRAGMENT / '+String(i+1).padStart(2,'0')+'</small><strong></strong><span>↗</span>';b.querySelector('strong').textContent=title;b.onclick=()=>{d.querySelector('.kicker').textContent='FRAGMENT / '+String(i+1).padStart(2,'0');d.querySelector('h2').textContent=title;d.querySelector('p').textContent=body;d.showModal()};board.append(b)});d.querySelector('button').onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d)d.close()});
</script></body></html>
